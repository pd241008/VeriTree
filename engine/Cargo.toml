[package]
name = "veritree-engine"
version = "0.1.0"
edition = "2021"
authors = ["Anonymous ICML Submission"]
description = "VeriTree: Hardware-Conscious Rust + C++20 Core Execution Engine"

[lib]
name = "veritree_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
rayon = "1.10"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

